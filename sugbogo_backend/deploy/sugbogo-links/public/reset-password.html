<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your password in SugboGo</title>
    <style>
      body { margin: 0; color: #1f2937; font: 1rem/1.6 system-ui, sans-serif; }
      main { max-width: 36rem; margin: 0 auto; padding: 3rem 1.25rem; }
      h1 { line-height: 1.2; }
    </style>
  </head>
  <body>
    <main>
      <h1>Reset your password in SugboGo</h1>
      <p>Open the original password-reset email on an Android device with SugboGo installed. Tap <strong>Reset Password</strong> and follow the instructions in the app.</p>
      <p>If the link opens in your browser again, check that <strong>Open supported links</strong> is enabled for SugboGo in Android Settings.</p>
    </main>
  </body>
</html>
